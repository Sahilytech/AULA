<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUMI · Calendario</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="logo">✦</span>LUMI</a><nav><a href="index.html">Inicio</a><a href="features.html">Study Space</a><a href="calendar.html">Calendario</a></nav><button id="theme" class="icon-btn">☾</button></header><main class="section" style="padding-top:60px"><div class="section-head"><div><span class="eyebrow">ACADEMIC PLANNER</span><h2>Calendario inteligente</h2></div><button class="primary small" onclick="newEvent()">+ Evento</button></div><div class="calendar-shell panel"><div class="calendar-toolbar"><button class="ghost small" onclick="prevMonth()">←</button><h3 id="monthTitle"></h3><button class="ghost small" onclick="nextMonth()">→</button></div><div class="month-grid" id="calendarGrid"></div></div><div class="grid" style="margin-top:20px"><div class="panel"><div class="panel-title"><span>Agenda</span><span class="muted">Próximamente</span></div><div id="agenda"></div></div><div class="panel"><div class="panel-title"><span>Plan de estudio</span><span class="live">● ACTIVO</span></div><p class="muted">Organizá bloques de lectura, repaso y entregas para que LUMI te ayude a visualizar tu semana.</p><button class="primary small" onclick="newEvent()">Planificar bloque</button></div></div></main><script src="app.js"></script><script>let current=new Date();const events=JSON.parse(localStorage.getItem('lumiEvents')||'[]');function render(){const y=current.getFullYear(),m=current.getMonth();document.getElementById('monthTitle').textContent=new Intl.DateTimeFormat('es-AR',{month:'long',year:'numeric'}).format(current);const first=new Date(y,m,1).getDay();const offset=(first+6)%7;const total=new Date(y,m+1,0).getDate();let h=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(x=>`<div class="cal-head">${x}</div>`).join('');for(let i=0;i<offset;i++)h+='<div class="cal-cell empty"></div>';for(let d=1;d<=total;d++){const key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,ev=events.filter(e=>e.date===key);h+=`<button class="cal-cell ${new Date().toDateString()===new Date(y,m,d).toDateString()?'today':''}" onclick="dayEvent('${key}')"><b>${d}</b>${ev.map(e=>`<small>${e.title}</small>`).join('')}</button>`}document.getElementById('calendarGrid').innerHTML=h;document.getElementById('agenda').innerHTML=events.slice(-6).reverse().map(e=>`<div class="task"><span><b>${e.title}</b><small>${e.date} · ${e.type}</small></span></div>`).join('')||'<p class="muted">No hay eventos todavía.</p>'}function prevMonth(){current.setMonth(current.getMonth()-1);render()}function nextMonth(){current.setMonth(current.getMonth()+1);render()}function newEvent(date){const title=prompt('Nombre del evento o entrega:');if(!title)return;const d=date||prompt('Fecha (AAAA-MM-DD):');if(!d)return;events.push({title,date:d,type:'Estudio'});localStorage.setItem('lumiEvents',JSON.stringify(events));render()}function dayEvent(d){newEvent(d)}render();</script></body></html>
