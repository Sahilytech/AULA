name: Validate LUMI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check frontend modules
        run: |
          for f in app.js academic.js academic-os.js cloud.js cloud-sync.js i18n.js lumi-core.js lumi-runtime.js lumi-library.js lumi-games.js lumi-brain.js lumi-language.js onboarding.js sqlite-db.js; do node --check "$f"; done
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check server.js
