<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUMI · Cuenta</title><link rel="stylesheet" href="style.css"></head><body><div class="orb orb-a"></div><div class="orb orb-b"></div><main class="auth-shell"><section class="auth-card"><a class="brand" href="index.html"><span class="logo">✦</span>LUMI</a><span class="eyebrow">LUMI CLOUD</span><h1>Tu espacio, sincronizado.</h1><p class="muted">Iniciá sesión para sincronizar tu progreso académico entre dispositivos.</p><div class="tabs"><button id="loginTab" class="active">Iniciar sesión</button><button id="signupTab">Crear cuenta</button></div><label class="lumi-field">Email<input id="email" type="email" autocomplete="email"></label><label class="lumi-field">Contraseña<input id="password" type="password" autocomplete="current-password"></label><button id="submit" class="primary full">Iniciar sesión</button><div id="authStatus" class="muted status"></div><a class="back" href="index.html">← Volver a LUMI</a></section></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let mode='login';const cfg=window.LUMI_CONFIG||{};const status=document.getElementById('authStatus');const client=cfg.SUPABASE_URL&&cfg.SUPABASE_ANON_KEY?supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY):null;function setMode(m){mode=m;document.getElementById('loginTab').classList.toggle('active',m==='login');document.getElementById('signupTab').classList.toggle('active',m==='signup');document.getElementById('submit').textContent=m==='login'?'Iniciar sesión':'Crear cuenta'}document.getElementById('loginTab').onclick=()=>setMode('login');document.getElementById('signupTab').onclick=()=>setMode('signup');document.getElementById('submit').onclick=async()=>{if(!client){status.textContent='La cuenta online todavía no está configurada.';return}const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password){status.textContent='Completá email y contraseña.';return}status.textContent='Procesando…';const r=mode==='login'?await client.auth.signInWithPassword({email,password}):await client.auth.signUp({email,password});status.textContent=r.error?r.error.message:(mode==='login'?'Sesión iniciada. Volviendo a LUMI…':'Cuenta creada. Revisá tu email si se solicita confirmación.');if(!r.error&&mode==='login')setTimeout(()=>location.href='index.html',600)};</script></body></html>
